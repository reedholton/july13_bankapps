spring.application.name=simple-bank-application

# Render (and most hosts) assign a port dynamically via the PORT environment variable
# and require the app to bind to it - falls back to 8080 for local development.
server.port=${PORT:8080}

# ---- MongoDB connection ----
# Reset to the safe default again - a real connection string with a real password keeps
# ending up in this file. Set the MONGODB_URI environment variable instead of editing
# this file directly, both locally and in Render's dashboard. See the backend README.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/simplebankdb}

# ---- JWT ----
# HS256 requires a secret key of at least 256 bits (32 bytes). This default is fine for
# local development only - override it with the JWT_SECRET environment variable for
# anything beyond your own machine, and definitely for any real deployment.
jwt.secret=${JWT_SECRET:your-super-secret-and-very-long-key-that-must-be-at-least-256-bits}

# 24 hours, in milliseconds.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Default admin account ----
app.admin.name=${ADMIN_NAME:Bank Administrator}
app.admin.email=${ADMIN_EMAIL:admin@simplebank.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# ---- CORS ----
# Comma-separated list of allowed frontend origins, e.g.
# https://your-frontend.onrender.com,http://localhost:5173
# Defaults to "*" (any origin) so local development keeps working with zero setup.
# Narrow this to your real deployed frontend URL(s) once you have one - see SecurityConfiguration.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
