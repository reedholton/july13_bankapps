spring.application.name=simple-bank-application

server.port=8080

# ---- MongoDB connection ----
# Reset to the safe default here - a real connection string with a real password was
# committed to this file at some point, which should never happen even in a private
# repo. Set the MONGODB_URI environment variable with your real Atlas connection string
# instead of editing this file directly. See the backend README for the full setup.
spring.mongodb.uri=mongodb+srv://reedholton_db_user:KGlczFClDNcsho5V@reedmongodbcluster.nddxnfi.mongodb.net/simplebankdb?retryWrites=true&w=majority

# ---- JWT ----
# HS256 requires a secret key of at least 256 bits (32 bytes). This default is fine for
# local development only - override it with the JWT_SECRET environment variable for
# anything beyond your own machine, and never commit a real production secret here.
jwt.secret=${JWT_SECRET:your-super-secret-and-very-long-key-that-must-be-at-least-256-bits}

# 24 hours, in milliseconds.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Default admin account ----
app.admin.name=${ADMIN_NAME:Bank Administrator}
app.admin.email=${ADMIN_EMAIL:admin@simplebank.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
